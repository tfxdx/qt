name: main
on:
 push:
jobs:
  mobile:
    runs-on: macos-15
    steps:
      - name: checkout
        uses: actions/checkout@main
      - name: setup-haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.2
      - name: run libraries from haxe
        run: |
          haxelib setup ~/haxelib
          haxelib git lime https://github.com/kittycathy233/lime
          haxelib install openfl
          haxelib install flixel 4.11.0
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui 2.6.1
          haxelib install newgrounds 1.3.0
          haxelib install hscript 2.5.0
          haxelib install hscript-ex
          haxelib install polymod 1.5.2
          haxelib git hxcpp https://github.com/haxefoundation/hxcpp
          haxelib git linc_luajit https://github.com/andreirudenko/linc_luajit
          haxelib git faxe https://github.com/ashea-code/faxe
          haxelib git discord_rpc https://github.com/aidan63/linc_discord-rpc
      - name: configure android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime rebuild hxcpp
      - name: compile
        run: haxelib run lime build android -ONLY_ARMV7
      - name: upload
        uses: actions/upload-artifact@main
        with:
          name: build
          path: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
